services:
  syncthing:
    image: syncthing/syncthing:latest
    container_name: librarydock-syncthing
    hostname: librarydock-dev
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ./data/syncthing/config:/var/syncthing/config
      - ./data/library:/var/syncthing/library
    ports:
      - '8385:8384'
      - '22001:22000/tcp'
      - '22001:22000/udp'
      - '21028:21027/udp'
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: librarydock-api
    command: npx nx serve api
    volumes:
      - .:/app
      - /app/node_modules
      - api-data:/app/apps/api/prisma
    ports:
      - '5656:5656'
    environment:
      - PORT=5656
      - NODE_ENV=development
      - SYNCTHING_URL=http://syncthing:8384
      - SYNCTHING_API_KEY=${SYNCTHING_API_KEY:-}
      - DATABASE_URL=file:./dev.db
    depends_on:
      - syncthing
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: librarydock-web
    command: npx nx serve web
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - '4200:80'
    environment:
      - DEV_PORT=80
      - DEV_HOST=0.0.0.0
      - API_PROXY_TARGET=http://api:5656
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api-data:
